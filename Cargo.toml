[workspace]
members = [
    "candle-layer-norm",
    "candle-rotary",
    "candle-flash-attn-v1",
    "candle-cublaslt",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Nicolas Patry <patry.nicolas@protonmail.com>"]
keywords = ["tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/huggingface/candle-extensions/"

[workspace.dependencies]
# Runtime
cudarc = { git = "https://github.com/mixlayer/cudarc.git", branch = "cublaslt_fp8", default-features = false, features = [
    "std",
    "cublaslt",
    "driver",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-linking",
] }
half = { version = "2.3.1", features = ["num-traits"] }
float8 = { version = "0.3.0" }
# Dev
# candle-nn = { version = ">=0.9", features = ["cuda"] }
candle-nn = { git = "https://github.com/zackangelo/candle.git", package = "candle-nn", branch = "llama_fp8", features = [
    "cuda",
] }
# Build
anyhow = { version = "1", features = ["backtrace"] }
bindgen_cuda = "0.1.1"
num_cpus = "1.15.0"
rayon = "1.7.0"
# candle = { version = ">=0.9", package = "candle-core", features = ["cuda"] }
candle = { git = "https://github.com/zackangelo/candle.git", package = "candle-core", branch = "llama_fp8", features = [
    "cuda",
] }
